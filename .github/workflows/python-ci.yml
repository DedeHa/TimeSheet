# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python CI

on:
  push:
    branches:
      - 'FCT|*'
      - 'INF|*'
      - 'PRO-*FCT|*'
      - 'PRO-*INF|*'
      - '!master' # Prevent direct pushes to main
      - '!RC*'  # Prevent direct pushes to release branches
  pull_request:
    branches:
      - 'master'
      - 'RC*'
      - 'FCT|*'
      - 'INF|*'
      - 'PRO-*FCT|*'
      - 'PRO-*INF|*'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          REQUIREMENTS_FILE=${{ env.REQUIREMENTS_FILE:-requirements.txt }}
          if [ -f "$REQUIREMENTS_FILE" ]; then pip install -r "$REQUIREMENTS_FILE"; fi
          pip install black ruff
      - name: Run Linter with Ruff
        run: ruff check .
      - name: Check Code Formatting with Black
        run: black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          # Install testing dependencies. 'openpyxl' is required for handling Excel files in tests.
          pip install pytest pytest-cov openpyxl
      - name: Run Tests with Coverage
        run: |
          mkdir -p reports
          coverage run -m pytest -v -s --junitxml=reports/test-results.xml
          coverage report > reports/coverage.txt
          coverage xml -o reports/coverage.xml
          coverage html -d reports/htmlcov
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
