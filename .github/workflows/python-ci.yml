# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python CI

on:
  push:
    branches:
      - 'FCT|*'
      - 'INF|*'
      - 'PRO-*FCT|*'
      - 'PRO-*INF|*'
      - '!master' # Prevent direct pushes to main
      - '!RC*'  # Prevent direct pushes to release branches
  pull_request:
    branches:
      - 'master'
      - 'RC*'
      - 'FCT|*'
      - 'INF|*'
      - 'PRO-*FCT|*'
      - 'PRO-*INF|*'
  workflow_dispatch:
    
jobs:
  
  lint: 
    name: Lint and Format Check
    runs-on: ubuntu-latest
    environment: 
      ${{ 
        (
          contains(github.ref, 'FCT|') && 'development' || 
          contains(github.ref, 'INF|') && 'development' 
        )
      }}
    
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print GitHub Context Information
        run: |
          echo "GitHub Ref: ${{ github.ref }}"
          echo "GitHub Base Ref: ${{ github.base_ref }}"
      
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black radon

      - name: Run ruff
        run: ruff check .

      - name: Run black formatter
        run: black --check .

      - name: Run radon
        run: radon cc . -a

  test:
    name: Run unit tests and publish results
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'pull_request' && contains(github.base_ref, 'RC')
    environment: staging

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pydocstyle

      - name: Run tests with coverage
        run: |
          pytest --cov=your_package_name --cov-report=xml --junitxml=results.xml

      - name: Run pydocstyle
        run: pydocstyle src_timesheetalgo

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.xml

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build

