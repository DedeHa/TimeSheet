# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python CI

on:
  push:
    branches:
      - 'FCT|*'
      - 'INF|*'
      - 'PRO-*FCT|*'
      - 'PRO-*INF|*'
      - '!master' # Prevent direct pushes to main
      - '!RC*'  # Prevent direct pushes to release branches
  pull_request:
    branches:
      - 'master'
      - 'RC*'
      - 'FCT|*'
      - 'INF|*'
      - 'PRO-*FCT|*'
      - 'PRO-*INF|*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment: ${{ github.ref == 'refs/heads/master' && 'prod' || github.ref == 'refs/heads/RC*' && 'stage' || github.ref == 'refs/heads/PRO-*INF|*' && 'testing' ||'dev' }}
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install black flake8 pytest pytest-cov openpyxl ruff

      - name: Check Code Formatting with Black and Upload Diff if Needed
        run: |
          rm -f black_diff_${{ matrix.python-version }}.txt
          echo "Python Version: ${{ matrix.python-version }}" > black_diff_${{ matrix.python-version }}.txt
          black --check . || (black --diff . >> black_diff_${{ matrix.python-version }}.txt && exit 1)

      - name: Upload Code Formatting Diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: black-diff-${{ matrix.python-version }}
          path: black_diff_${{ matrix.python-version }}.txt
          if-no-files-found: ignore
                   
      - name: Run Linter with Ruff
        run: |
          rm -f ruff_lint_${{ matrix.python-version }}.txt
          echo "Python Version: ${{ matrix.python-version }}" > ruff_lint_${{ matrix.python-version }}.txt
          ruff check . || (ruff check . >> ruff_lint_${{ matrix.python-version }}.txt && exit 1)

      - name: Upload Linter Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-lint-${{ matrix.python-version }}
          path: ruff_lint_${{ matrix.python-version }}.txt
          if-no-files-found: ignore

      - name: Fail Workflow on Check Failure
        if: failure()
        run: |
          echo "Checks failed. Push or pull request is not allowed."
          exit 1

