[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timesheet"
version = "0.1.0"
description = "Automatic timelog organisation and timesheet processing"
readme = "README.md"
authors = [ { name = "Dennis Hartel" } ]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "openpyxl==3.1.5",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = [
    "black==24.10.0",
    "flake8==7.1.1",
    "pytest==8.3.4",
    "pytest-cov==5.0.0",
    "ruff==0.7.4",
    "radon==6.0.1",
    "pydocstyle==6.3.0",
    "freezegun==1.5.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src_timesheetalgo"]

[tool.black]
line-length = 88

[tool.ruff]
select = ["E", "F", "W", "C", "B", "I"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-markers --maxfail=1"
log_cli = true

# Note:
# To install in development mode: `python -m pip install -e .[dev]`
# To build distribution: `python -m build`