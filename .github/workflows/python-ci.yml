# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python CI

on:
  push:
    branches:
      - 'FCT|*'
      - 'INF|*'
      - 'PRO-*FCT|*'
      - 'PRO-*INF|*'
      - '!main' # Prevent direct pushes to main
      - '!RC*'  # Prevent direct pushes to release branches
  pull_request:
    branches:
      - 'main'
      - 'RC*'
      - 'FCT|*'
      - 'INF|*'
      - 'PRO-*FCT|*'
      - 'PRO-*INF|*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install black flake8 pytest pytest-cov openpyxl

      - name: Check Code Formatting with Black, Store Diff, and Prevent Push
        run: |
          rm -f black_diff.txt
          black --check . || (black --diff . > black_diff.txt && echo "Code formatting check failed. Push to main or RC branches is not allowed." && exit 1)

      - name: Upload Code Formatting Diff
        if: always() && failure()
        uses: actions/upload-artifact@v4
        with:
          name: black-diff
          path: black_diff.txt
          overwrite: true
          
