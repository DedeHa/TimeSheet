# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python CI

on:
  push:
    branches:
      - 'feature/*'
      - 'refactor/*'
      - 'docs/*'
      - 'test/*'
      - 'bugfix/*'
      - 'hotfix/*'
      - '!master' # Prevent direct pushes to main
      - '!release/*'  # Prevent direct pushes to release branches
  pull_request:
    branches:
      - 'master'
      - 'release/*'
      - 'feature/*'
      - 'refactor/*'
      - 'docs/*'
      - 'test/*'
      - 'bugfix/*'
      - 'hotfix/*'
  workflow_dispatch:
    
jobs:
  
  lint: 
    name: Lint and Format Check
    runs-on: ubuntu-latest
    environment: 
      ${{ 
        (
          contains(github.ref, 'feature/') && 'development' || 
          contains(github.ref, 'refactor/') && 'development' ||
          contains(github.ref, 'docs/') && 'development' ||
          contains(github.ref, 'test/') && 'development'
        ) && 'development' || ''
      }}
    
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Poetry installation
        uses: actions/cache@v3
        with:
          path: ~/.local
          key: poetry-${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: ${{ runner.os }}-poetry-

      - name: Print GitHub Context Information and setup environment
        run: |
          echo "GitHub Ref: ${{ github.ref }}"
          echo "GitHub Base Ref: ${{ github.base_ref }}"
          echo "GitHub Event Name: ${{ github.event_name }}"
          poetry --version

      - name: Install dependencies
        run: poetry install --no-interaction
          
      - name: Run ruff
        run: ruff check src_timesheetalgo tests

      - name: Run black formatter
        run: black --check src_timesheetalgo tests

      - name: Run pydocstyle
        run: pydocstyle src_timesheetalgo tests

      - name: Run radon
        run: radon cc src_timesheetalgo -a

  test:
    name: Run unit tests and publish results
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'pull_request' && (contains(github.base_ref, 'release/') || github.base_ref == 'master')
    environment: staging

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Poetry installation
        uses: actions/cache@v3
        with:
          path: ~/.local
          key: poetry-3.12

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: ${{ runner.os }}-poetry-

      - name: Install dependencies and setup environment
        run: poetry install --no-interaction

      - name: Run tests with coverage
        run: |
          mkdir -p tests/reports
          pytest tests --cov=src_timesheetalgo --cov-branch --cov-report=html:tests/reports/htmlcov --cov-report=term-missing --junitxml=tests/reports/test-results.xml
          #pytest --junitxml=reports/test-results.xml --cov=my_project --cov-report=xml --cov-report=html
          #coverage run -m pytest -v -s

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/reports/test-results.xml
            tests/reports/htmlcov

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Poetry installation
        uses: actions/cache@v3
        with:
          path: ~/.local
          key: poetry-3.12

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: ${{ runner.os }}-poetry-

      - name: Install dependencies and setup environment
        run: poetry install --no-interaction

      - name: Build package
        run: poetry build
