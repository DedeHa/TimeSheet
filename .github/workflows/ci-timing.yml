---
# PRO-369 / O8: Continuous CI-Pipeline Timing Benchmark.
#
# See doc/01_Implementation_Plan_CI_Timing_Benchmark.md for the full plan.
#
# Behaviour
# ---------
# Collects per-job / per-step execution times from the GitHub Actions REST API
# (authoritative - no workflow instrumentation required) for successful
# pull_request runs of the `Python CI` workflow (python-ci.yml), appends one row
# per successful step to ci-timings.csv on the orphan `ci-metrics` branch, then
# recomputes running statistics (mean, stddev, median, p95, n, last) and writes
# CI_TIMING_REPORT.md to the same branch.
#
# Triggers
# --------
# Phase 1 (initial): workflow_dispatch only - `inputs.backfill` drives a sweep
# of historical successful PR runs; an empty backfill captures only the most
# recent successful PR run. Phase 2 adds `workflow_run` (see B.6 step 3) once
# the seeded report is verified.
#
# Invariants
# ----------
# * Never writes to the PR branch (only `ci-metrics`).
# * Never fails a PR (this workflow is a non-gating observer; even on internal
#   failure it reports the problem to the run summary and exits cleanly).
# * Never re-triggers `Python CI` - `python-ci.yml`'s `on:` does not include
#   push to `ci-metrics`, so the metrics push cannot loop.

name: CI Timing Benchmark

on:
  # Continuous capture: fires once per completed `Python CI` run. We read
  # that run's timings via the API, append to ci-metrics, and regenerate the
  # report. workflow_run runs in default-branch context with repo secrets.
  workflow_run:
    workflows: ["Python CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Sweep all historical PR runs of Python CI to seed the dataset from scratch. Off = just collect the latest successful run.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      min_samples:
        description: 'Minimum successful samples before a step appears in the main report tables (lower = more keys, noisier).'
        required: false
        default: '3'
        type: string
      include_housekeeping:
        description: 'Include GitHub synthetic steps (Set up job, Post ...) in the dataset. Off = real workflow steps only.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      update_data:
        description: 'Also write JSON data to the master branch data/ folder. Off = ci-metrics only.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Avoid racing on the same orphan branch when two backfills are dispatched.
concurrency:
  group: ci-timing
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  MIN_SAMPLES: ${{ inputs.min_samples || '3' }}
  INCLUDE_HOUSEKEEPING: ${{ inputs.include_housekeeping || 'false' }}
  METRICS_BRANCH: ci-metrics
  UPDATE_DATA: ${{ github.event_name == 'workflow_run' && 'true' || (inputs.update_data || 'false') }}

jobs:
  collect:
    name: Capture & aggregate CI timings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master

      # No Python deps required: collect_ci_timings.py and
      # aggregate_ci_timings.py are standard-library only. We use the
      # repository's pre-installed `gh` CLI for API access.

      - name: Ensure ci-metrics orphan branch exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Note: `git -c key=value` must be on the same line as the git command;
          # the YAML `run:` block is passed to bash as a single multiline string,
          # so a backslash continuation does NOT carry -c across newlines on
          # the GitHub-hosted runner. Putting them on one line avoids a
          # "command not found" error from the leading -c.
          if ! gh api --silent "repos/${{ github.repository }}/branches/$METRICS_BRANCH" >/dev/null 2>&1; then
            echo "Creating orphan branch $METRICS_BRANCH"
            git switch --orphan "$METRICS_BRANCH"
            git rm -rf --quiet . 2>/dev/null || true
            printf '# CI Timing Benchmark\n\nPersistent dataset for the continuous CI-pipeline timing benchmark (PRO-369).\n' > README.md
            git add README.md
            git -c user.name=github-actions -c user.email=actions@github.com commit --quiet -m "chore(ci-timing): initialise orphan ci-metrics branch"
            git -c user.name=github-actions -c user.email=actions@github.com push --quiet -u origin "$METRICS_BRANCH"
            # Verify the push actually landed on origin. Without this the step
            # can silently report success while the orphan branch is still
            # absent from the remote, and every later step then operates on
            # a phantom branch.
            if ! gh api --silent "repos/${{ github.repository }}/branches/$METRICS_BRANCH" >/dev/null 2>&1; then
              echo "FATAL: push did not create branch $METRICS_BRANCH on origin"
              exit 1
            fi
            echo "Created orphan branch $METRICS_BRANCH on origin"
            git switch -
          else
            echo "Branch $METRICS_BRANCH already exists"
          fi

      - name: Checkout ci-metrics branch
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$METRICS_BRANCH":"$METRICS_BRANCH"
          git worktree add --force -f metrics "$METRICS_BRANCH"

      - name: Collect timings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INCLUDE_HOUSEKEEPING: ${{ env.INCLUDE_HOUSEKEEPING }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          cd metrics
          # workflow_run -> collect the just-completed run (if it was a
          # successful pull_request run).
          # workflow_dispatch with backfill=true -> sweep all history.
          # workflow_dispatch with backfill=false -> most recent successful PR run.
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            conclusion=$(gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/actions/runs/$TRIGGERING_RUN_ID" \
              --jq '.conclusion // empty')
            event_type=$(gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/actions/runs/$TRIGGERING_RUN_ID" \
              --jq '.event // empty')
            if [ "$conclusion" != "success" ] || [ "$event_type" != "pull_request" ]; then
              echo "Triggering run $TRIGGERING_RUN_ID is $conclusion ($event_type); skipping."
              exit 0
            fi
            echo "Collecting run $TRIGGERING_RUN_ID (workflow_run)"
            PR_NUMBER="$PR_NUMBER" \
              python3 ../.github/scripts/collect_ci_timings.py \
                "$REPO" "$TRIGGERING_RUN_ID" ci-timings.csv
          elif [ "${{ inputs.backfill }}" = "true" ]; then
            echo "Backfill mode: sweeping all successful PR runs of Python CI"
            # --include-housekeeping is a store_true flag (no value).
            # Only pass it when the input is true; omitting it when false
            # avoids 'unrecognized arguments: false' from argparse.
            HK_FLAG=""
            if [ "$INCLUDE_HOUSEKEEPING" = "true" ]; then
              HK_FLAG="--include-housekeeping"
            fi
            python3 ../.github/scripts/backfill_ci_timings.py \
              --repo "$REPO" \
              --csv ci-timings.csv \
              $HK_FLAG
          else
            run_id=$(gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/actions/workflows/python-ci.yml/runs?event=pull_request&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
            if [ -z "$run_id" ]; then
              echo "No successful pull_request runs found for Python CI; nothing to collect."
            else
              echo "Collecting run $run_id (single-run dispatch)"
              PR_NUMBER="${{ github.event.pull_request.number }}" \
                python3 ../.github/scripts/collect_ci_timings.py \
                  "$REPO" "$run_id" ci-timings.csv
            fi
          fi

      - name: Aggregate timings & render report
        env:
          MIN_SAMPLES: ${{ env.MIN_SAMPLES }}
        run: |
          set -euo pipefail
          cd metrics
          MIN_SAMPLES="$MIN_SAMPLES" \
            python3 ../.github/scripts/aggregate_ci_timings.py \
              ci-timings.csv CI_TIMING_REPORT.md

      - name: Commit & push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd metrics
          # Use --porcelain: unlike `git diff --quiet` it also sees untracked
          # files. On the first backfill run ci-timings.csv and
          # CI_TIMING_REPORT.md are brand-new, so `git diff` alone would
          # silently skip the commit even though data was collected.
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to ci-timings.csv or CI_TIMING_REPORT.md; skipping commit."
            exit 0
          fi
          # See the orphan-branch step above: `git -c` must be on the same line
          # as the git command, or the runner treats -c as a standalone command.
          git -c user.name=github-actions -c user.email=actions@github.com add ci-timings.csv CI_TIMING_REPORT.md
          git -c user.name=github-actions -c user.email=actions@github.com commit --quiet -m "chore(ci-timing): update CI timings dataset and report"
          git -c user.name=github-actions -c user.email=actions@github.com push --quiet origin "$METRICS_BRANCH"

      - name: Write data/ to master (conditional)
        if: env.UPDATE_DATA == 'true'
        run: |
          set -euo pipefail
          # Commit data/ci_runtimes.json and data/ci_metrics.json to master branch
          # Separate commit from ci-metrics to prevent loop
          # The data files live at the project root on master
          if [ -f data/ci_runtimes.json ] || [ -f data/ci_metrics.json ]; then
            echo "JSON files exist at project root"
            git -c user.name=github-actions -c user.email=actions@github.com add data/ci_runtimes.json data/ci_metrics.json
            git -c user.name=github-actions -c user.email=actions@github.com commit --quiet -m "chore(ci-timing): update data/ folder with JSON outputs"
            git -c user.name=github-actions -c user.email=actions@github.com push --quiet origin master
          else
            echo "No JSON files found at project root; skipping commit."
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-report
          path: metrics/CI_TIMING_REPORT.md
