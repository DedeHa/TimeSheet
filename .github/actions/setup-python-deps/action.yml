name: Setup Python Dependencies
description: Composite action to setup Python, cache pip and install dev dependencies
# Note: the repository must already be checked out by the calling job before
# this action runs. A local (./) action cannot resolve its own action.yml until
# the repo is on the runner, so checkout cannot live here.
inputs:
  python-version:
    description: 'Python version'
    default: '3.14'
runs:
  using: composite
  steps:
    - name: Cache virtual environment
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          venv-${{ runner.os }}-${{ inputs.python-version }}-
          venv-${{ runner.os }}-
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies and setup environment
      shell: bash
      # pip builds the editable install in an isolated PEP 517 environment using
      # the [build-system] requires (setuptools/wheel), so build tooling does not
      # need to be installed here. The packaging frontend `build` is installed
      # only in the deploy job, which is the only place that runs `python -m build`.
      #
      # O2 (AC-4): Restore the virtual environment from cache when available.
      # The cache key includes pyproject.toml, so any dependency change
      # invalidates the cache and triggers a fresh install.
      run: |
        if [ -d ".venv" ]; then
          echo "Using cached virtual environment"
          source .venv/bin/activate
        else
          echo "Creating new virtual environment"
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .[dev]
        fi
        # Make the venv available to subsequent job steps (composite actions
        # run each step in its own shell, so `source activate` alone is not
        # enough — PATH must be exported via GITHUB_ENV).
        echo "PATH=$PWD/.venv/bin:$PATH" >> "$GITHUB_ENV"
