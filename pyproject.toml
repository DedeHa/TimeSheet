[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "timesheet-algo"
version = "4.1.1"
description = "TimeSheet algorithm for FDTech time tracking and data extraction"
authors = ["Dennis Hartel <dede@example.com>"]
readme = "README.md"
license = "MIT"
packages = [
    {include = "src_timesheetalgo"},
    {include = "src_azesheetalgo"},
]

[tool.poetry.dependencies]
python = "^3.11"
openpyxl = "3.1.2"
PyYAML = "6.0.1"

[tool.poetry.group.dev.dependencies]
black = "23.9.1"
ruff = "0.0.289"
pytest = "7.4.2"
pytest-cov = "4.1.0"
pydocstyle = "*"
radon = "*"
flake8 = "6.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers --tb=short"

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pydocstyle]
inherit = false
match = "(?!test_).*\\.py"
match-dir = "^(?!tests).*"

[tool.radon]
exclude = "tests/*"
complexity = "A"
