---
# PRO-379: CI Dashboard — GitHub Pages Visualization
#
# Behaviour
# ---------
# Mirrors JSON data from the ci-metrics orphan branch to docs/data/ on master,
# then commits the dashboard data so GitHub Pages can serve the updated
# dashboard. This workflow runs after ci-timing.yml completes and ensures
# the dashboard auto-updates within 5 minutes of workflow completion.
#
# Triggers
# --------
# - workflow_run: fires after ci-timing.yml completes
# - workflow_dispatch: manual trigger for testing
#
# Invariants
# ----------
# * Never writes to the PR branch (only master)
# * Never fails a PR (non-gating observer)
# * Never re-triggers Python CI - uses [skip ci] in commit messages
# * Dashboard serves from docs/ folder (GitHub Pages configuration)

name: Publish Dashboard

on:
  workflow_run:
    workflows: ["CI Timing Benchmark"]
    types: [completed]
  workflow_dispatch:

# Avoid racing on the same orphan branch when two backfills are dispatched.
concurrency:
  group: dashboard-publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish Dashboard Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master

      - name: Checkout ci-metrics branch
        id: metrics
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin ci-metrics >/dev/null 2>&1; then
            echo "::notice::Branch ci-metrics does not exist on the remote; skipping dashboard publish."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin ci-metrics:ci-metrics
          git worktree add --force -f metrics ci-metrics
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Copy data files to docs/data/
        id: copy
        if: steps.metrics.outputs.available == 'true'
        run: |
          set -euo pipefail
          # The producers (.github/scripts/ci_paths.py) resolve their output
          # directory relative to the worktree, so the JSON payloads live in
          # metrics/docs/data/ on the ci-metrics branch.
          src="metrics/docs/data"
          missing=0
          for f in "$src/ci_metrics.json" "$src/ci_runtimes.json"; do
            if [ ! -f "$f" ]; then
              echo "::warning::$f is missing on the ci-metrics branch - skipping dashboard publish."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p docs/data
          cp "$src/ci_metrics.json" docs/data/metrics.json
          # Apply sanitization to runtimes.json to remove synthetic placeholder rows
          # and trim to the most recent 50 distinct CI runs (the AC-5 minimum).
          # This keeps the published dashboard in lock-step with the seeded
          # docs/data/runtimes.json produced by seed_dashboard_data.py.
          python3 .github/scripts/sanitize_dashboard_data.py \
            --root "metrics/docs/data" \
            --runs 50 \
            --output "docs/data/runtimes.json" \
            --fresh-timestamp
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Validate JSON payloads
        id: validate
        if: steps.metrics.outputs.available == 'true'
        run: |
          set -euo pipefail
          src="metrics/docs/data"
          # Validate source payloads (before sanitization)
          python3 .github/scripts/validator.py "$src/ci_metrics.json" metrics
          python3 .github/scripts/validator.py "$src/ci_runtimes.json" runtimes
          # Validate sanitized outputs (after sanitization)
          python3 .github/scripts/validator.py docs/data/metrics.json metrics
          python3 .github/scripts/validator.py docs/data/runtimes.json runtimes
          echo "validation=passed" >> "$GITHUB_OUTPUT"

      - name: Commit & push if changed
        if: steps.copy.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to dashboard data; skipping commit."
            exit 0
          fi
          git -c user.name=github-actions -c user.email=actions@github.com add docs/data/metrics.json docs/data/runtimes.json
          git -c user.name=github-actions -c user.email=actions@github.com commit --quiet -m "chore(dashboard): update dashboard data [skip ci]"
          git -c user.name=github-actions -c user.email=actions@github.com push --quiet origin master

      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: docs/data/