# This workflow implements the Feature → Master → Release → Deployment strategy
# - Push events: Lint checks on development branches (feature/*, bugfix/*, etc.)
# - PR to master: Full tests required (Lint + Unit Tests + Code Coverage) - QUALITY GATE
# - Release tags (vX.Y.Z): Deployment to production only (tests already passed on master)
#
# For more information see:
# - https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
# - sup/naming_conventions.md (Development Workflow section)

name: Python CI

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'docs/**'
      - 'test/**'
      - '!master' # Prevent direct pushes to master
    tags:
      - 'v*' # Deploy on release tags (vX.Y.Z)
  pull_request:
    branches:
      - 'master'
      - 'release/**'
  workflow_dispatch:

jobs:

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    environment:
      ${{
        (
          contains(github.ref, 'feature/') ||
          contains(github.ref, 'bugfix/') ||
          contains(github.ref, 'hotfix/') ||
          contains(github.ref, 'refactor/') ||
          contains(github.ref, 'docs/') ||
          contains(github.ref, 'test/')
        ) && 'development'
      }}

    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print GitHub Context Information and setup environment
        run: |
          echo "GitHub Ref: ${{ github.ref }}"
          echo "GitHub Base Ref: ${{ github.base_ref }}"
          echo "GitHub Event Name: ${{ github.event_name }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build setuptools wheel
          pip install -e .[dev]

      - name: Run ruff
        run: ruff check src_timesheetalgo tests

      - name: Run black formatter
        run: black --check src_timesheetalgo tests

      - name: Run pydocstyle
        run: pydocstyle src_timesheetalgo tests

      - name: Run radon
        run: radon cc src_timesheetalgo -a

  test:
    name: Run unit tests and publish results
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    environment: staging

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and setup environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build setuptools wheel
          pip install -e .[dev]

      - name: Run tests with coverage
        run: |
          mkdir -p tests/reports
          pytest tests --cov=src_timesheetalgo --cov-branch --cov-report=html:tests/reports/htmlcov --cov-report=term-missing --junitxml=tests/reports/test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/reports/test-results.xml
            tests/reports/htmlcov

  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and setup environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build setuptools wheel
          pip install -e .[dev]

      - name: Install packaging tools
        run: |
          pip install build
