[pytest]
# Pytest configuration for TimeSheet project
# Test categories: unit, integration, system

testpaths = tests
python_files = test_*.py conftest.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests - test individual functions and methods in isolation
    integration: Integration tests - test multiple components working together (end-to-end workflows)
    system: System tests - test the complete system with real resources (CSV and Excel files)

# Logging configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s

# Coverage options
addopts =
    -v
    --strict-markers
    --tb=short

# Disable warnings for cleaner output (optional)
filterwarnings =
    ignore::DeprecationWarning
