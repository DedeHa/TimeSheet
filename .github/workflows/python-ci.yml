# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python CI

on:
  push:
    branches:
      - 'FCT|*'
      - 'INF|*'
      - 'PRO-*FCT|*'
      - 'PRO-*INF|*'
      - '!master' # Prevent direct pushes to main
      - '!RC*'  # Prevent direct pushes to release branches
  pull_request:
    branches:
      - 'master'
      - 'RC*'
      - 'FCT|*'
      - 'INF|*'
      - 'PRO-*FCT|*'
      - 'PRO-*INF|*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: 
      ${{ 
        github.event_name == 'pull_request' && (
          contains(github.base_ref, '*FCT|*') && 'development' || 
          contains(github.base_ref, 'INF|') && 'development' || 
          contains(github.base_ref, 'RC') && 'staging' || 
          github.base_ref == 'master' && 'production'
        ) || (
          contains(github.ref, 'FCT|') && 'development' || 
          contains(github.ref, 'INF|') && 'development' || 
          contains(github.ref, 'RC') && 'staging' 
        )
      }}
    
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Python Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install black flake8 pytest pytest-cov openpyxl ruff
          echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Code Formatting and Linting
        run: |
          echo "Python Version: ${{ matrix.python-version }}" > lint_results_${{ matrix.python-version }}.txt
          black --check . || black --diff . >> lint_results_${{ matrix.python-version }}.txt
          ruff check . || ruff check . >> lint_results_${{ matrix.python-version }}.txt

      - name: Upload Linting Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-${{ matrix.python-version }}
          path: lint_results_${{ matrix.python-version }}.txt
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Tests with Coverage
        run: |
          mkdir -p reports
          coverage run -m pytest -v -s --junitxml=reports/test-results.xml
          coverage report > reports/coverage.txt
          coverage xml -o reports/coverage.xml
          coverage html -d reports/htmlcov

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore
