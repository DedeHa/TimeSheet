# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python CI

on:
  push:
    branches:
      - 'FCT|*'
      - 'INF|*'
      - 'PRO-*FCT|*'
      - 'PRO-*INF|*'
      - '!master' # Prevent direct pushes to main
      - '!RC*'  # Prevent direct pushes to release branches
  pull_request:
    branches:
      - 'master'
      - 'RC*'
      - 'FCT|*'
      - 'INF|*'
      - 'PRO-*FCT|*'
      - 'PRO-*INF|*'
  workflow_dispatch:
    
jobs:
  
  lint: 
    name: Lint and Format Check
    runs-on: ubuntu-latest
    environment: 
      ${{ 
        (
          contains(github.ref, 'FCT|') && 'development' || 
          contains(github.ref, 'INF|') && 'development' 
        )
      }}
    
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print GitHub Context Information and setup environment
        run: |
          echo "GitHub Ref: ${{ github.ref }}"
          echo "GitHub Base Ref: ${{ github.base_ref }}"
          echo "GitHub Event Name: ${{ github.event_name }}"
          #echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV
                
      - name: Install dependencies 
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install black flake8 pytest pytest-cov openpyxl ruff radon pydocstyle
          
      - name: Run ruff
        run: ruff check .

      - name: Run black formatter
        run: black --check .

      - name: Run pydocstyle
        run: pydocstyle src_timesheetalgo

      - name: Run radon
        run: radon cc src_timesheetalgo -a

  test:
    name: Run unit tests and publish results
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'pull_request' && contains(github.base_ref, 'RC')
    environment: staging

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and setup environment
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install black flake8 pytest pytest-cov openpyxl ruff

      - name: Run tests with coverage
        run: |
          mkdir -p tests/reports
          pytest tests --cov=src_timesheetalgo --cov-branch --cov-report=html:tests/reports/htmlcov --cov-report=term-missing --junitxml=tests/reports/test-results.xml
          #coverage run -m pytest -v -s

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/reports/test-results.xml
            tests/reports/htmlcov

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and setup environment
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install black flake8 pytest pytest-cov openpyxl ruff

      - name: Install packaging tools
        run: |
          pip install build

