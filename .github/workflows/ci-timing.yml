---
# PRO-369: Continuous CI-Pipeline Timing Benchmark.
#
# Collects per-job / per-step execution times from the GitHub Actions REST API
# (authoritative - no workflow instrumentation required) for successful
# pull_request runs of the `Python CI` workflow (python-ci.yml), appends one row
# per successful step to ci-timings.csv on the orphan `ci-metrics` branch, then
# recomputes running statistics (mean, stddev, median, p95, n, last) and writes
# CI_TIMING_REPORT.md to the same branch. The aggregated JSON payloads
# (docs/data/ci_metrics.json and docs/data/ci_runtimes.json) are also written to
# the worktree by the producer scripts (see ci_paths.py) so they land on the
# ci-metrics branch alongside the CSV and report; dashboard publish steps
# (merged from the former publish-dashboard.yml workflow) mirror them to
# docs/data/ on master.
#
# Triggers
# --------
# - workflow_run: fires after ci-timing.yml completes
# - workflow_dispatch: manual trigger for testing
#
# Invariants
# ----------
# * Never writes to the PR branch (only `ci-metrics`).
# * Never fails a PR (this workflow is a non-gating observer; even on internal
#   failure it reports the problem to the run summary and exits cleanly).
# * Never re-triggers `Python CI` - `python-ci.yml`'s `on:` does not include
#   push to `ci-metrics`, so the metrics push cannot loop.

name: CI Timing Benchmark

on:
  workflow_run:
    workflows: ["Python CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Sweep all historical PR runs of Python CI to seed the dataset from scratch. Off = just collect the latest successful run.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      min_samples:
        description: 'Minimum successful samples before a step appears in the main report tables (lower = more keys, noisier).'
        required: false
        default: '3'
        type: string
      include_housekeeping:
        description: 'Include GitHub synthetic steps (Set up job, Post ...) in the dataset. Off = real workflow steps only.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      update_data:
        description: 'Reserved for future use — data is no longer written to master.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_runs:
        description: 'Maximum runs to retain in the JSON dataset (0 = unlimited).'
        required: false
        default: '0'
        type: string

# Avoid racing on the same orphan branch when two backfills are dispatched.
concurrency:
  group: ci-timing
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  MIN_SAMPLES: ${{ inputs.min_samples || '3' }}
  INCLUDE_HOUSEKEEPING: ${{ inputs.include_housekeeping || 'false' }}
  METRICS_BRANCH: ci-metrics
  MAX_RUNS: ${{ inputs.max_runs || '0' }}

jobs:
  collect:
    name: Capture & aggregate CI timings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master

      - name: Ensure ci-metrics orphan branch exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh api --silent "repos/${{ github.repository }}/branches/$METRICS_BRANCH" >/dev/null 2>&1; then
            echo "Creating orphan branch $METRICS_BRANCH"
            git switch --orphan "$METRICS_BRANCH"
            git rm -rf --quiet . 2>/dev/null || true
            printf '# CI Timing Benchmark\n\nPersistent dataset for the continuous CI-pipeline timing benchmark (PRO-369).\n' > README.md
            git add README.md
            git -c user.name=github-actions -c user.email=actions@github.com commit --quiet -m "chore(ci-timing): initialise orphan ci-metrics branch"
            git -c user.name=github-actions -c user.email=actions@github.com push --quiet -u origin "$METRICS_BRANCH"
            if ! gh api --silent "repos/${{ github.repository }}/branches/$METRICS_BRANCH" >/dev/null 2>&1; then
              echo "FATAL: push did not create branch $METRICS_BRANCH on origin"
              exit 1
            fi
            echo "Created orphan branch $METRICS_BRANCH on origin"
            git switch -
          else
            echo "Branch $METRICS_BRANCH already exists"
          fi

      - name: Checkout ci-metrics branch
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$METRICS_BRANCH":"$METRICS_BRANCH"
          git worktree add --force -f metrics "$METRICS_BRANCH"

      - name: Collect timings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INCLUDE_HOUSEKEEPING: ${{ env.INCLUDE_HOUSEKEEPING }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          cd metrics
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            conclusion=$(gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/actions/runs/$TRIGGERING_RUN_ID" \
              --jq '.conclusion // empty')
            event_type=$(gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/actions/runs/$TRIGGERING_RUN_ID" \
              --jq '.event // empty')
            if [ "$conclusion" != "success" ] || [ "$event_type" != "pull_request" ]; then
              echo "Triggering run $TRIGGERING_RUN_ID is $conclusion ($event_type); skipping."
              exit 0
            fi
            echo "Collecting run $TRIGGERING_RUN_ID (workflow_run)"
            PR_NUMBER="$PR_NUMBER" \
              python3 ../.github/scripts/collect_ci_timings.py \
                "$REPO" "$TRIGGERING_RUN_ID" ci-timings.csv
          elif [ "${{ inputs.backfill }}" = "true" ]; then
            echo "Backfill mode: sweeping all successful PR runs of Python CI"
            HK_FLAG=""
            if [ "$INCLUDE_HOUSEKEEPING" = "true" ]; then
              HK_FLAG="--include-housekeeping"
            fi
            python3 ../.github/scripts/backfill_ci_timings.py \
              --repo "$REPO" \
              --csv ci-timings.csv \
              $HK_FLAG
          else
            run_id=$(gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/actions/workflows/python-ci.yml/runs?event=pull_request&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
            if [ -z "$run_id" ]; then
              echo "No successful pull_request runs found for Python CI; nothing to collect."
            else
              echo "Collecting run $run_id (single-run dispatch)"
              PR_NUMBER="${{ github.event.pull_request.number }}" \
                python3 ../.github/scripts/collect_ci_timings.py \
                  "$REPO" "$run_id" ci-timings.csv
            fi
          fi

      - name: Aggregate timings & render report
        env:
          MIN_SAMPLES: ${{ env.MIN_SAMPLES }}
        run: |
          set -euo pipefail
          cd metrics
          MIN_SAMPLES="$MIN_SAMPLES" \
            python3 ../.github/scripts/aggregate_ci_timings.py \
              ci-timings.csv CI_TIMING_REPORT.md

      - name: Commit & push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd metrics
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to ci-timings dataset; skipping commit."
            exit 0
          fi
          if [ -f ci-timings.csv ]; then
            git -c user.name=github-actions -c user.email=actions@github.com add \
              ci-timings.csv
          fi
          if [ -f CI_TIMING_REPORT.md ]; then
            git -c user.name=github-actions -c user.email=actions@github.com add \
              CI_TIMING_REPORT.md
          fi
          if [ -f docs/data/ci_metrics.json ]; then
            git -c user.name=github-actions -c user.email=actions@github.com add \
              docs/data/ci_metrics.json
          fi
          if [ -f docs/data/ci_runtimes.json ]; then
            git -c user.name=github-actions -c user.email=actions@github.com add \
              docs/data/ci_runtimes.json
          fi
          git -c user.name=github-actions -c user.email=actions@github.com commit --quiet \
            -m "chore(ci-timing): update CI timings dataset, report, and dashboard JSON [skip ci]"
          git -c user.name=github-actions -c user.email=actions@github.com push --quiet origin "$METRICS_BRANCH"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-report
          path: metrics/CI_TIMING_REPORT.md

  publish:
    name: Publish Dashboard Data
    needs: [collect]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master

      - name: Checkout ci-metrics branch
        id: metrics
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "$METRICS_BRANCH" >/dev/null 2>&1; then
            echo "::notice::Branch $METRICS_BRANCH does not exist on the remote; skipping dashboard publish."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$METRICS_BRANCH":"$METRICS_BRANCH"
          git worktree add --force -f metrics "$METRICS_BRANCH"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Copy data files to docs/data/
        id: copy
        if: steps.metrics.outputs.available == 'true'
        run: |
          set -euo pipefail
          src="metrics/docs/data"
          missing=0
          for f in "$src/ci_metrics.json" "$src/ci_runtimes.json"; do
            if [ ! -f "$f" ]; then
              echo "::warning::$f is missing on the ci-metrics branch - skipping dashboard publish."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p docs/data
          cp "$src/ci_metrics.json" docs/data/metrics.json
          python3 .github/scripts/sanitize_dashboard_data.py \
            --root "metrics/docs/data" \
            --runs 50 \
            --output "docs/data/runtimes.json" \
            --fresh-timestamp
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Validate JSON payloads
        id: validate
        if: steps.metrics.outputs.available == 'true'
        run: |
          set -euo pipefail
          src="metrics/docs/data"
          python3 .github/scripts/validator.py "$src/ci_metrics.json" metrics
          python3 .github/scripts/validator.py "$src/ci_runtimes.json" runtimes
          python3 .github/scripts/validator.py docs/data/metrics.json metrics
          python3 .github/scripts/validator.py docs/data/runtimes.json runtimes
          echo "validation=passed" >> "$GITHUB_OUTPUT"

      - name: Commit & push if changed
        if: steps.copy.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to dashboard data; skipping commit."
            exit 0
          fi
          git -c user.name=github-actions -c user.email=actions@github.com add docs/data/metrics.json docs/data/runtimes.json
          git -c user.name=github-actions -c user.email=actions@github.com commit --quiet -m "chore(dashboard): update dashboard data [skip ci]"
          git -c user.name=github-actions -c user.email=actions@github.com push --quiet origin HEAD:dashboard-data-update
          if ! gh pr view --repo "$GITHUB_REPOSITORY" --head dashboard-data-update --json number -q .number > /dev/null 2>&1; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head dashboard-data-update --title "chore(dashboard): update dashboard data [skip ci]" --body "Automated dashboard data update from CI Timing Benchmark.\n\nRefs: PRO-379"
          fi

      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: docs/data/
