[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timesheet"
version = "0.1.0"
description = "Automatic timelog organisation and timesheet processing"
readme = "README.md"
authors = [ { name = "Dennis Hartel" } ]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "openpyxl==3.1.5",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = [
    "black==26.3.1",
    "flake8==7.1.1",
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "ruff==0.7.4",
    "radon==6.0.1",
    "pydocstyle==6.3.0",
    "freezegun==1.5.5",
    "yamllint==1.35.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src_timesheetalgo"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
per-file-ignores = { "tests/**" = ["E501"] }
select = ["E", "F", "W", "C", "B", "I"]

[tool.pytest.ini_options]
# Single source of truth for pytest. Test levels = one folder + one marker each:
#   unit         tests/unit/         individual functions/methods in isolation
#   integration  tests/integration/  TimeSheetProcessor pipeline on a mock workbook
#   system       tests/system/       real-resource copies + CLI flow (skip if missing)
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --tb=short"
# Keep this section free of '%' (e.g. a log_cli_format): radon reads pyproject
# through configparser, which treats '%' as interpolation and crashes. Live
# logging is off, so a custom format is not needed here.
log_cli = false
markers = [
    "unit: individual functions/methods in isolation (tmp files or mocks, no real resources)",
    "integration: TimeSheetProcessor pipeline on the in-memory dummy workbook",
    "system: real-resource copies + CLI flow, skipped when resources are missing",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src_timesheetalgo"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# Note:
# To install in development mode: `python -m pip install -e .[dev]`
# To build distribution: `python -m build`