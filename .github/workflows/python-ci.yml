# This workflow implements the Feature → Master → Release → Deployment strategy
# - Push events: Lint checks on development branches (feature/*, bugfix/*, etc.)
# - PR to master: Full tests required (Lint + Unit + Integration + System Tests + Code Coverage) - QUALITY GATE
# - Release tags (vX.Y.Z): Deployment to production only (tests already passed on master)
#
# Node.js version: Prepared for Node.js 24 migration (June 2, 2026)
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
#
# For more information see:
# - https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
# - sup/naming_conventions.md (Development Workflow section)

name: Python CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'docs/**'
      - 'test/**'
      - '!master' # Prevent direct pushes to master
    tags:
      - 'v*' # Deploy on release tags (vX.Y.Z)
  pull_request:
    branches:
      - 'master'
      - 'release/**'
  workflow_dispatch:

jobs:

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    environment:
      ${{
        (
          contains(github.ref, 'feature/') ||
          contains(github.ref, 'bugfix/') ||
          contains(github.ref, 'hotfix/') ||
          contains(github.ref, 'refactor/') ||
          contains(github.ref, 'docs/') ||
          contains(github.ref, 'test/')
        ) && 'development'
      }}

    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print GitHub Context Information and setup environment
        run: |
          echo "GitHub Ref: ${{ github.ref }}"
          echo "GitHub Base Ref: ${{ github.base_ref }}"
          echo "GitHub Event Name: ${{ github.event_name }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build setuptools wheel
          pip install -e .[dev]

      - name: Run ruff
        run: ruff check src_timesheetalgo tests

      - name: Run black formatter
        run: black --check src_timesheetalgo tests

      - name: Run pydocstyle
        run: pydocstyle src_timesheetalgo tests

      - name: Run radon
        run: radon cc src_timesheetalgo -a

  test:
    name: Run all test levels (unit + integration + system)
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    environment: staging

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and setup environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build setuptools wheel
          pip install -e .[dev]

      - name: Prepare report directory
        run: mkdir -p tests/reports

      - name: Validate documentation traceability
        run: pytest -q .github/workflows/test_docs_traceability.py

      # Each test level runs as its own visible, attributable step so a failure
      # points straight at the level that broke. Coverage is measured fresh on
      # the unit step and accumulated across the later levels (--cov-append);
      # the 90% gate is enforced once at the end over the combined data. The
      # per-step --cov-fail-under=0 stops an individual level (which on its own
      # cannot reach 90%) from failing the run prematurely.
      - name: Run unit tests
        run: pytest -m unit --cov=src_timesheetalgo --cov-branch --cov-report= --cov-fail-under=0 --junitxml=tests/reports/unit-results.xml

      - name: Run integration tests
        run: pytest -m integration --cov=src_timesheetalgo --cov-branch --cov-append --cov-report= --cov-fail-under=0 --junitxml=tests/reports/integration-results.xml

      - name: Run system tests
        run: pytest -m system --cov=src_timesheetalgo --cov-branch --cov-append --cov-report= --cov-fail-under=0 --junitxml=tests/reports/system-results.xml

      - name: Combined coverage report and 90% gate
        run: |
          coverage report --show-missing --fail-under=90
          coverage html -d tests/reports/htmlcov

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            tests/reports/unit-results.xml
            tests/reports/integration-results.xml
            tests/reports/system-results.xml
            tests/reports/htmlcov
            tests/reports/traceability-matrix.md
            tests/reports/traceability-matrix.html

      - name: Comment traceability report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const mdPath = 'tests/reports/traceability-matrix.md';
            let md = 'Traceability report not available.';
            try {
              md = fs.readFileSync(mdPath, 'utf8');
            } catch (e) {
              console.warn('Could not read traceability markdown: ' + e.message);
            }
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `### Generated Traceability Report\n\n${md}\n---\n\nTest results and artifacts are available at: ${runUrl}`;
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });

  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and setup environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build setuptools wheel
          pip install -e .[dev]

      - name: Run integration tests
        run: |
          pytest tests/integration --junitxml=tests/reports/integration-test-results.xml

      - name: Run system tests
        run: |
          pytest tests/system --junitxml=tests/reports/system-test-results.xml

      - name: Install packaging tools
        run: |
          pip install build
