name: Setup Python Dependencies
description: Composite action to checkout repo, setup Python, cache pip and install dev dependencies
inputs:
  python-version:
    description: 'Python version'
    default: '3.13'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies and setup environment
      shell: bash
      # pip builds the editable install in an isolated PEP 517 environment using
      # the [build-system] requires (setuptools/wheel), so build tooling does not
      # need to be installed here. The packaging frontend `build` is installed
      # only in the deploy job, which is the only place that runs `python -m build`.
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
