---
# This workflow implements the Feature → Master → Release → Deployment strategy
# - Pull requests to master: Full checks (Naming + Lint + Unit + Integration + System Tests + Code Coverage) - QUALITY GATE
# - Pull requests to release/*: Full checks (same quality gate as master)
# - Release tags (vX.Y.Z): Full checks (Naming + Lint + Tests + Coverage) run again as
#   a release gate, then Deployment to production only if check + test pass.
# Branch pushes do not trigger CI; a branch with an open PR is validated once (by the PR).
#
# Node.js version: Prepared for Node.js 24 migration (June 2, 2026)
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
#
# PRO-368: All Python jobs use the reusable composite action
# .github/workflows/action.yml (FR-17, QR-09) which centralises checkout,
# Python setup, pip caching (FR-16) and dependency installation. Node.js is no
# longer installed unconditionally (AC3) - the lint job is pure Python, so the
# setup-node step was removed entirely. Only JavaScript actions (commitlint,
# github-script) need the Node 24 runtime, which the runner provides via
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24.
#
# For more information see:
# - https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
# - doc/CONTRIBUTING.md (Development Workflow section)

name: Python CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Quality checks run on pull requests only. A branch with an open PR is
# therefore validated once (by the PR) instead of twice (branch push + PR).
# Direct branch pushes no longer trigger CI; release tags still trigger the
# deploy job, and workflow_dispatch keeps manual runs available.
on:
  pull_request:
    branches:
      - 'master'
      - 'release/**'
  push:
    tags:
      - 'v*'  # Deploy on release tags (vX.Y.Z)
  workflow_dispatch:

# Supersede an in-progress run when a new commit is pushed to the same PR, so
# rapid successive pushes do not stack redundant runs. Release tags get a unique
# group (no PR number), so deployments are never cancelled by this rule.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Naming Conventions & Linting Check
    runs-on: ubuntu-latest
    # Run on every PR (to master or release/**), on release tags before deploy,
    # and on manual dispatch. The commit/PR-metadata validation steps below stay
    # guarded by `if: github.event_name == 'pull_request'`, so on a tag push this
    # job runs the lint tools only.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    environment: ${{ (contains(github.head_ref, 'feature/') || contains(github.head_ref, 'bugfix/') || contains(github.head_ref, 'hotfix/') || contains(github.head_ref, 'refactor/') || contains(github.head_ref, 'docs/') || contains(github.head_ref, 'test/')) && 'development' || '' }}
    steps:
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'

      - name: Print GitHub Context Information and setup environment
        run: |
          echo "GitHub Ref: ${{ github.ref }}"
          echo "GitHub Base Ref: ${{ github.base_ref }}"
          echo "GitHub Event Name: ${{ github.event_name }}"

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
          commitDepth: 1
        continue-on-error: true

      # Add JIRA reference validation in commit messages
      - name: Validate Jira reference in commits
        if: github.event_name == 'pull_request'
        run: |
          git log --format=%H ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} |
          while read hash; do
            if ! git log -1 --format=%B "$hash" | grep -qE "Refs: PRO-[0-9]+"; then
              echo "Missing or invalid Jira reference in commit $hash"
              exit 1
            fi
          done
        continue-on-error: false

      # Validate PR Title
      - name: Validate PR Title
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prTitle = context.payload.pull_request.title;
            // Format: [type][PRO-123] Description
            // Types from CONTRIBUTING.md: feat, fix, docs, refactor, test, chore, hotfix
            const prType = 'feat|fix|docs|refactor|test|chore|hotfix';
            const regex = new RegExp('^\\[(?:' + prType + ')\\]\\[PRO-\\d+\\]\\s+.+$', 'i');
            if (!regex.test(prTitle)) {
              core.setFailed('PR title format invalid. Expected: [type][PRO-XXX] Description');
            }
        continue-on-error: false

      # Validate PR Body
      - name: Validate PR Body
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const hasSummary = /##\s+Summary\s*\n/.test(body);
            const hasTesting = /##\s+Testing\s*\n/.test(body);
            if (!hasSummary) {
              core.setFailed('PR body missing mandatory "## Summary" section');
            }
            if (!hasTesting) {
              core.setFailed('PR body missing mandatory "## Testing" section');
            }
            // Check for placeholder text
            if (/TODO|TBD|Describe your changes\.\.\./i.test(body)) {
              core.setFailed('PR body contains placeholder text (TODO, TBD, etc.)');
            }
            // Check for mandatory JIRA reference in body
            if (!/Refs: PRO-[0-9]+/i.test(body)) {
              core.setFailed('PR body must include JIRA reference (Refs: PRO-XXX)');
            }
        continue-on-error: false

      - name: Run lint tools (ruff, black, pydocstyle, radon)
        run: |
          ruff check src_timesheetalgo tests
          black --check src_timesheetalgo tests
          pydocstyle src_timesheetalgo tests
          radon cc src_timesheetalgo -a

  test:
    name: Run all test levels (unit + integration + system)
    runs-on: ubuntu-latest
    needs: [check]
    # Full test suite runs on all PRs (master and release/**), on release tags
    # (so the quality gate is enforced before deploy), and on manual dispatch.
    # PR-only steps (traceability comment, sticky summary) self-guard on the
    # event / issue number, so they no-op cleanly on tag pushes.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    environment: staging
    # Least-privilege token: read the repo (checkout) and write PR comments
    # (traceability comment + PRO-337 sticky quality-gate summary).
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'

      - name: Prepare report directory
        run: mkdir -p tests/reports

      - name: Validate documentation traceability
        run: pytest -q .github/workflows/validate_docs_traceability.py

      - name: Validate PR quality-gate summary generator
        run: pytest -q .github/tests/test_generate_pr_summary.py

      # Each test level runs as its own visible, attributable step so a failure
      # points straight at the level that broke. Coverage is measured fresh on
      # the unit step and accumulated across the later levels (--cov-append);
      # the 90% gate is enforced once at the end over the combined data. The
      # per-step --cov-fail-under=0 stops an individual level (which on its own
      # cannot reach 90%) from failing the run prematurely.
      - name: Run unit tests
        run: pytest -m unit --cov=src_timesheetalgo --cov-branch --cov-report= --cov-fail-under=0 --junitxml=tests/reports/unit-results.xml

      - name: Run integration tests
        run: pytest -m integration --cov=src_timesheetalgo --cov-branch --cov-append --cov-report= --cov-fail-under=0 --junitxml=tests/reports/integration-results.xml

      - name: Run system tests
        run: pytest -m system --cov=src_timesheetalgo --cov-branch --cov-append --cov-report= --cov-fail-under=0 --junitxml=tests/reports/system-results.xml

      # Additive (PRO-337): export machine-readable coverage for the PR summary.
      # Runs even if an earlier level failed so the summary always has coverage
      # data; --fail-under=0 keeps this step green - the real 90% quality gate is
      # still enforced by the step below, so existing behaviour is unchanged.
      - name: Export machine-readable coverage
        if: always()
        run: coverage json -o tests/reports/coverage.json --fail-under=0

      - name: Combined coverage report and 90% gate
        run: |
          coverage report --show-missing --fail-under=90
          coverage html -d tests/reports/htmlcov

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: |
            tests/reports/unit-results.xml
            tests/reports/integration-results.xml
            tests/reports/system-results.xml
            tests/reports/coverage.json
            tests/reports/htmlcov
            tests/reports/traceability-matrix.md
            tests/reports/traceability-matrix.html

      - name: Comment traceability report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const mdPath = 'tests/reports/traceability-matrix.md';
            let md = '';
            try {
              md = fs.readFileSync(mdPath, 'utf8');
            } catch (e) {
              console.warn('Could not read traceability markdown: ' + e.message);
            }
            const codeMatch = md.match(/Code coverage:\s*([0-9.]+)%/i);
            const codeCov = codeMatch ? codeMatch[1] : null;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const urlEncodedRun = encodeURIComponent(runUrl);

            let body = '### Traceability Summary\n\n';
            if (codeCov !== null) {
              body += `**Code Coverage:** ${codeCov}%\n\n`;
            }
            body += `[Complete traceability matrix →](${urlEncodedRun}?artifact=traceability-matrix.md)`;

            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });

      # PRO-337: publish a consolidated quality-gate summary from within the test
      # job (no separate job, so the pipeline graph stays check -> test -> deploy).
      # Both steps use if: always() so the summary is still published when a test
      # level or the coverage gate fails. TEST_RESULT is taken from job.status,
      # which reflects whether the earlier steps in this job passed. The JUnit and
      # coverage.json files already sit in tests/reports, so no download is needed.
      - name: Generate PR quality-gate summary
        if: always()
        env:
          LINT_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ job.status }}
        run: python .github/workflows/generate_pr_summary.py

      - name: Publish or update sticky PR comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pro-337-ci-quality-gate-summary -->';
            let body;
            try {
              body = fs.readFileSync('tests/reports/test-summary.md', 'utf8');
            } catch (e) {
              core.warning('Summary file not found: ' + e.message);
              return;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            if (!issue_number) {
              core.warning('No pull request number in context; skipping comment.');
              return;
            }
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info('Updated existing summary comment #' + existing.id);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info('Created new summary comment');
            }

  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    needs: [check, test]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    environment: production

    steps:
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'

      - name: Install packaging tools
        run: |
          pip install build
